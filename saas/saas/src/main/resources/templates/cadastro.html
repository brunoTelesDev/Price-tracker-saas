<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Price Tracker - Cadastro</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Criar conta
                    </h3>

                    <form id="formCadastro">

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Digite seu email"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label for="senha" class="form-label">
                                Senha
                            </label>

                            <input
                                    type="password"
                                    id="senha"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    required>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Criar conta

                        </button>

                    </form>

                    <div id="mensagem" class="text-center mt-3"></div>

                    <div class="text-center mt-3">

                        <span>Já possui uma conta?</span>

                        <a href="/login">
                            Entrar
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    document.getElementById("formCadastro")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            try {

                const response = await fetch("/api/usuarios/cadastrar", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })

                });

                const texto = await response.text();

                if (response.ok) {

                    mensagem.className = "text-center mt-3 text-success";

                    mensagem.textContent =
                        "Conta criada com sucesso!";

                    setTimeout(function() {
                        window.location.href = "/login";
                    }, 1000);

                } else {

                    mensagem.className = "text-center mt-3 text-danger";

                    mensagem.textContent =
                        texto || "Erro ao criar conta.";

                }

            } catch (erro) {

                console.error(erro);

                mensagem.className = "text-center mt-3 text-danger";

                mensagem.textContent =
                    "Erro ao conectar com o servidor.";

            }

        });

</script>

</body>

</html>
