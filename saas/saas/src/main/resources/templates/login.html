<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Price Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Price Tracker
                    </h3>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                    type="email"
                                    name="username"
                                    class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Senha</label>

                            <input
                                    type="password"
                                    name="password"
                                    class="form-control">

                        </div>

                        <button
                                class="btn btn-primary w-100">

                            Entrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
